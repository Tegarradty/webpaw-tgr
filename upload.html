<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload File - WEB PAW TGR</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">

    <!-- NAVBAR -->
    <div class="container-navbar">
        <ul class="ul-navbar">
            <li class="li-navbar"><a href="drive.html" class="a-navbar">MY DRIVE</a></li>
            <li class="li-navbar active"><a href="upload.html" class="a-navbar">UPLOAD</a></li>
        </ul>
    </div>

    <!-- UPLOAD CONTENT -->
    <div class="container-upload">
        <div class="upload-card">
            <h1 class="upload-title">Upload File</h1>
            <p class="upload-subtitle">Simpan file kamu di sini</p>

            <form class="upload-form" id="uploadForm">

                <div class="form-group">
                    <label class="form-label">Judul / Nama File</label>
                    <input type="text" name="judul" id="judul" class="form-input"
                           placeholder="Contoh: Catatan PAW Pertemuan 3" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Kategori</label>
                    <select name="kategori" id="kategori" class="form-input form-select" required>
                        <option value="" disabled selected>Pilih Kategori...</option>
                        <option value="PAW">Pemrograman Aplikasi Web (PAW)</option>
                        <option value="Strukdat">Struktur Data</option>
                        <option value="Alpro">Algoritma &amp; Pemrograman</option>
                        <option value="Basis Data">Basis Data</option>
                        <option value="Catatan">Catatan Pribadi</option>
                        <option value="Referensi">Referensi / Materi</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Deskripsi <span style="color:#555;font-weight:normal;">(opsional)</span></label>
                    <textarea name="deskripsi" id="deskripsi" class="form-input form-textarea"
                              placeholder="Catatan singkat tentang file ini..." rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Pilih File</label>
                    <div class="file-drop-area" id="dropArea"
                         onclick="document.getElementById('fileInput').click()">
                        <div class="file-drop-icon">&#11014;</div>
                        <p class="file-drop-text">Klik atau drag &amp; drop file di sini</p>
                        <p class="file-drop-hint">PDF, DOCX, PPTX, XLSX, ZIP, Gambar, Video (Maks. 5MB)</p>
                        <input type="file" id="fileInput" style="display:none"
                               accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,.rar,.txt,.png,.jpg,.jpeg,.mp4,.mp3"
                               onchange="handleFileSelect(this)" />
                    </div>
                    <p class="file-name-display" id="fileName"></p>
                </div>

                <!-- Progress bar -->
                <div id="progressWrap" style="display:none;">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progressBar"></div>
                    </div>
                    <p class="progress-label" id="progressLabel">Memproses...</p>
                </div>

                <div id="statusMsg" style="display:none;" class="status-msg"></div>

                <div style="display:flex; gap:12px;">
                    <button type="submit" class="btn-upload" id="btnSubmit">Simpan ke Drive</button>
                    <a href="drive.html" class="btn-drive">Lihat Drive</a>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="container-footer">
        <h1 class="h1-footer">website ini dibuat sepenuh hati</h1>
    </div>
</div>

<script>
const STORAGE_KEY = "webpaw_files";
const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB

let selectedFile = null;

function formatSize(bytes) {
  if (!bytes) return "0 B";
  const k = 1024;
  const sizes = ["B","KB","MB","GB"];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
}

function getFileType(filename) {
  if (!filename) return "other";
  const ext = filename.split(".").pop().toLowerCase();
  const map = {
    "pdf":"pdf", "doc":"word", "docx":"word",
    "ppt":"ppt", "pptx":"ppt",
    "xls":"excel", "xlsx":"excel",
    "zip":"zip", "rar":"zip",
    "png":"image", "jpg":"image", "jpeg":"image",
    "txt":"text", "mp4":"video", "mp3":"audio",
  };
  return map[ext] || "other";
}

function handleFileSelect(input) {
  const file = input.files[0];
  if (!file) return;

  if (file.size > MAX_FILE_SIZE) {
    showStatus("File terlalu besar! Maksimal 5MB (karena disimpan di browser).", "error");
    input.value = "";
    selectedFile = null;
    document.getElementById("fileName").textContent = "";
    return;
  }

  selectedFile = file;
  const sizeMB = (file.size / 1024 / 1024).toFixed(2);
  const display = document.getElementById("fileName");
  display.textContent = "✓ " + file.name + " (" + sizeMB + " MB)";
  display.style.color = "#85D8F6";
}

// Drag & Drop
const dropArea = document.getElementById("dropArea");
dropArea.addEventListener("dragover", e => {
  e.preventDefault();
  dropArea.style.borderColor = "#85D8F6";
  dropArea.style.background  = "rgba(133,216,246,0.1)";
});
dropArea.addEventListener("dragleave", () => {
  dropArea.style.borderColor = "#1A565F";
  dropArea.style.background  = "rgba(255,255,255,0.03)";
});
dropArea.addEventListener("drop", e => {
  e.preventDefault();
  dropArea.style.borderColor = "#1A565F";
  dropArea.style.background  = "rgba(255,255,255,0.03)";
  const file = e.dataTransfer.files[0];
  if (file) {
    document.getElementById("fileInput").files = e.dataTransfer.files;
    handleFileSelect(document.getElementById("fileInput"));
  }
});

// Submit form
document.getElementById("uploadForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const judul    = document.getElementById("judul").value.trim();
  const kategori = document.getElementById("kategori").value;
  const deskripsi = document.getElementById("deskripsi").value.trim();

  if (!judul || !kategori) {
    showStatus("Judul dan kategori wajib diisi!", "error");
    return;
  }
  if (!selectedFile) {
    showStatus("Pilih file terlebih dahulu!", "error");
    return;
  }

  const btn = document.getElementById("btnSubmit");
  btn.disabled = true;
  btn.textContent = "Menyimpan...";

  // Progress bar
  const progressWrap = document.getElementById("progressWrap");
  const progressBar  = document.getElementById("progressBar");
  progressWrap.style.display = "block";
  progressBar.style.width = "0%";

  // Baca file sebagai base64 menggunakan FileReader
  const reader = new FileReader();

  reader.onprogress = (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      progressBar.style.width = pct + "%";
      document.getElementById("progressLabel").textContent = "Memproses... " + pct + "%";
    }
  };

  reader.onload = (e) => {
    try {
      // Simpan ke localStorage
      const raw   = localStorage.getItem(STORAGE_KEY);
      const files = raw ? JSON.parse(raw) : [];

      const newFile = {
        id:          String(Date.now()),
        judul,
        kategori,
        deskripsi,
        fileName:    selectedFile.name,
        fileData:    e.target.result, // base64 data URL
        fileSize:    selectedFile.size,
        fileSizeStr: formatSize(selectedFile.size),
        fileType:    getFileType(selectedFile.name),
        waktu:       new Date().toLocaleString("id-ID"),
        createdAt:   new Date().toISOString(),
      };

      files.unshift(newFile);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(files));

      progressWrap.style.display = "none";
      btn.disabled    = false;
      btn.textContent = "Simpan ke Drive";

      showStatus("File berhasil disimpan! Redirect ke Drive...", "success");
      document.getElementById("uploadForm").reset();
      document.getElementById("fileName").textContent = "";
      selectedFile = null;

      setTimeout(() => { window.location.href = "drive.html"; }, 1200);

    } catch (err) {
      progressWrap.style.display = "none";
      btn.disabled    = false;
      btn.textContent = "Simpan ke Drive";
      // Kemungkinan localStorage penuh
      showStatus("Gagal menyimpan. Storage browser mungkin penuh. Coba hapus file lama.", "error");
    }
  };

  reader.onerror = () => {
    progressWrap.style.display = "none";
    btn.disabled    = false;
    btn.textContent = "Simpan ke Drive";
    showStatus("Gagal membaca file.", "error");
  };

  reader.readAsDataURL(selectedFile);
});

function showStatus(msg, type) {
  const el = document.getElementById("statusMsg");
  el.textContent   = msg;
  el.className     = "status-msg " + (type === "success" ? "status-success" : "status-error");
  el.style.display = "block";
}
</script>
</body>
</html>
