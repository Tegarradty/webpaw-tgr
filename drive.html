<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Drive - WEB PAW TGR</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">

    <!-- NAVBAR -->
    <div class="container-navbar">
        <ul class="ul-navbar">
            <li class="li-navbar"><a href="drive.html" class="a-navbar">MY DRIVE</a></li>
            <li class="li-navbar"><a href="upload.html" class="a-navbar">UPLOAD</a></li>
        </ul>
    </div>

    <!-- DRIVE LAYOUT -->
    <div class="drive-layout">

        <!-- SIDEBAR -->
        <aside class="drive-sidebar">
            <a href="upload.html" class="btn-new-upload">+ Upload File Baru</a>

            <div class="sidebar-stats">
                <p class="stats-title">Penyimpanan</p>
                <div class="stats-bar-bg">
                    <div class="stats-bar-fill" id="storageBar"></div>
                </div>
                <p class="stats-label" id="storageLabel">Memuat...</p>
            </div>

            <nav class="sidebar-nav">
                <p class="sidebar-section-title">Kategori</p>
                <ul class="sidebar-list" id="sidebarKategori">
                    <li class="sidebar-item active" data-kategori="semua" onclick="filterKategori(this)">
                        <span class="sidebar-icon">&#128193;</span> Semua File
                        <span class="sidebar-count" id="count-semua">0</span>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="drive-main">

            <!-- Topbar -->
            <div class="drive-topbar">
                <div class="drive-search-wrap">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" id="searchInput" class="drive-search"
                           placeholder="Cari file..." oninput="handleSearch()" />
                </div>
                <div class="drive-controls">
                    <select class="drive-sort" onchange="handleSort(this.value)">
                        <option value="date">Terbaru</option>
                        <option value="name">Nama A-Z</option>
                        <option value="size">Ukuran</option>
                    </select>
                    <button class="btn-view" id="btnGrid" onclick="setView('grid')" title="Grid View">&#9638;</button>
                    <button class="btn-view" id="btnList" onclick="setView('list')" title="List View">&#9776;</button>
                </div>
            </div>

            <!-- Stats bar -->
            <div class="drive-stats-bar" id="statsBar">
                <span id="statFiles">-- file</span>
                <span class="stats-dot">&#183;</span>
                <span id="statSize">-- MB</span>
            </div>

            <!-- File Grid / List -->
            <div id="fileContainer" class="file-grid">
                <div class="drive-loading">Memuat file...</div>
            </div>
        </main>
    </div>

    <!-- FOOTER -->
    <div class="container-footer">
        <h1 class="h1-footer">website ini dibuat sepenuh hati</h1>
    </div>
</div>

<!-- PREVIEW MODAL -->
<div id="previewModal" class="modal-overlay" style="display:none;" onclick="closePreview(event)">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalTitle">Preview</h3>
            <button class="modal-close" onclick="closePreviewBtn()">&#10005;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
            <a id="modalDownload" href="#" class="btn-modal-download" download>Download</a>
            <button class="btn-modal-close" onclick="closePreviewBtn()">Tutup</button>
        </div>
    </div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal-overlay" style="display:none;" onclick="closeEditModal(event)">
    <div class="modal-box modal-box-sm">
        <div class="modal-header">
            <h3>Edit File</h3>
            <button class="modal-close" onclick="document.getElementById('editModal').style.display='none'">&#10005;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editId" />
            <div class="form-group" style="margin-bottom:12px;">
                <label class="form-label">Judul</label>
                <input type="text" id="editJudul" class="form-input" />
            </div>
            <div class="form-group" style="margin-bottom:12px;">
                <label class="form-label">Kategori</label>
                <select id="editKategori" class="form-input form-select">
                    <option value="PAW">PAW</option>
                    <option value="Strukdat">Struktur Data</option>
                    <option value="Alpro">Algoritma &amp; Pemrograman</option>
                    <option value="Basis Data">Basis Data</option>
                    <option value="Catatan">Catatan Pribadi</option>
                    <option value="Referensi">Referensi / Materi</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Deskripsi</label>
                <textarea id="editDeskripsi" class="form-input form-textarea" rows="2"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-upload" onclick="saveEdit()">Simpan</button>
            <button class="btn-modal-close" onclick="document.getElementById('editModal').style.display='none'">Batal</button>
        </div>
    </div>
</div>

<script>
// Deteksi otomatis base URL — berjalan di localhost maupun hosting manapun
const API = window.location.origin + "/api";

let allFiles = [];
let currentView     = "grid";
let currentKategori = "semua";
let currentSort     = "date";
let currentSearch   = "";

const FILE_ICONS = {
  pdf:   { icon: "&#128196;", color: "#e05555" },
  word:  { icon: "&#128221;", color: "#4f9cf9" },
  ppt:   { icon: "&#128202;", color: "#e06c2e" },
  excel: { icon: "&#128200;", color: "#3ab97a" },
  zip:   { icon: "&#128230;", color: "#e6c13d" },
  image: { icon: "&#128247;", color: "#a78bfa" },
  video: { icon: "&#127909;", color: "#f472b6" },
  audio: { icon: "&#127925;", color: "#34d399" },
  text:  { icon: "&#128196;", color: "#94a3b8" },
  other: { icon: "&#128196;", color: "#94a3b8" },
};

const KATEGORI_ICONS = {
  "PAW":"&#128187;", "Strukdat":"&#128736;", "Alpro":"&#9997;",
  "Basis Data":"&#128197;", "Catatan":"&#128221;",
  "Referensi":"&#128218;", "Lainnya":"&#128193;",
};

// ============ LOAD DATA ============
async function loadAll() {
  try {
    const [filesRes, statsRes] = await Promise.all([
      fetch(API + "/files"),
      fetch(API + "/stats"),
    ]);
    const filesJson = await filesRes.json();
    const statsJson = await statsRes.json();

    if (filesJson.success) {
      allFiles = filesJson.data;
      buildSidebar(statsJson);
      renderFiles();
      updateStatsBar(statsJson);
    }
  } catch {
    document.getElementById("fileContainer").innerHTML =
      '<div class="drive-error">Tidak bisa terhubung ke server.<br>Jalankan: <code>node server.js</code></div>';
  }
}

function buildSidebar(stats) {
  const ul = document.getElementById("sidebarKategori");
  const totalCount = allFiles.length;
  document.getElementById("count-semua").textContent = totalCount;

  // Kumpulkan kategori unik
  const cats = {};
  allFiles.forEach(f => { cats[f.kategori] = (cats[f.kategori] || 0) + 1; });

  // Hapus item lama kecuali "Semua"
  const items = ul.querySelectorAll("li:not(:first-child)");
  items.forEach(i => i.remove());

  Object.entries(cats).sort().forEach(([cat, count]) => {
    const li = document.createElement("li");
    li.className = "sidebar-item";
    li.dataset.kategori = cat;
    li.onclick = function() { filterKategori(this); };
    const ico = KATEGORI_ICONS[cat] || "&#128193;";
    li.innerHTML = `<span class="sidebar-icon">${ico}</span> ${cat} <span class="sidebar-count">${count}</span>`;
    ul.appendChild(li);
  });

  // Storage bar (anggap max 1GB)
  const MAX = 1 * 1024 * 1024 * 1024;
  const pct = Math.min(((stats.totalSizeBytes || 0) / MAX) * 100, 100).toFixed(1);
  document.getElementById("storageBar").style.width = pct + "%";
  document.getElementById("storageLabel").textContent =
    (stats.totalSize || "0 B") + " / 1 GB";
}

function updateStatsBar(stats) {
  document.getElementById("statFiles").textContent = (stats.totalFiles || 0) + " file";
  document.getElementById("statSize").textContent  = stats.totalSize || "0 B";
}

// ============ RENDER FILES ============
function renderFiles() {
  let files = [...allFiles];

  if (currentKategori !== "semua") {
    files = files.filter(f => f.kategori === currentKategori);
  }
  if (currentSearch) {
    const kw = currentSearch.toLowerCase();
    files = files.filter(f =>
      f.judul.toLowerCase().includes(kw) ||
      (f.deskripsi && f.deskripsi.toLowerCase().includes(kw))
    );
  }
  if (currentSort === "name") {
    files.sort((a, b) => a.judul.localeCompare(b.judul));
  } else if (currentSort === "size") {
    files.sort((a, b) => (b.fileSize || 0) - (a.fileSize || 0));
  }

  const container = document.getElementById("fileContainer");
  container.className = currentView === "grid" ? "file-grid" : "file-list";

  if (files.length === 0) {
    container.innerHTML = `<div class="drive-empty">
      <div style="font-size:60px;">&#128193;</div>
      <p>Belum ada file di sini.</p>
      <a href="upload.html" class="btn-new-upload" style="display:inline-block;margin-top:12px;">+ Upload File</a>
    </div>`;
    return;
  }

  if (currentView === "grid") {
    container.innerHTML = files.map(f => fileCard(f)).join("");
  } else {
    container.innerHTML = `
      <table class="file-table">
        <thead><tr>
          <th>Nama File</th><th>Kategori</th><th>Ukuran</th><th>Tanggal</th><th>Aksi</th>
        </tr></thead>
        <tbody>${files.map(f => fileRow(f)).join("")}</tbody>
      </table>`;
  }
}

function fileCard(f) {
  const { icon, color } = FILE_ICONS[f.fileType] || FILE_ICONS.other;
  return `
    <div class="file-card" ondblclick="previewFile(${f.id})">
      <div class="file-card-icon" style="color:${color}">${icon}</div>
      <div class="file-card-name" title="${escHtml(f.judul)}">${escHtml(f.judul)}</div>
      <div class="file-card-meta">${escHtml(f.kategori)} &middot; ${f.fileSizeStr || "?"}</div>
      <div class="file-card-actions">
        ${f.filePath ? `<a href="${f.filePath}" download="${escHtml(f.fileName)}" class="btn-card-action" title="Download">&#11123;</a>` : ""}
        <button class="btn-card-action" onclick="openEdit(${f.id})" title="Edit">&#9998;</button>
        <button class="btn-card-action btn-card-del" onclick="deleteFile(${f.id})" title="Hapus">&#128465;</button>
      </div>
    </div>`;
}

function fileRow(f) {
  const { icon, color } = FILE_ICONS[f.fileType] || FILE_ICONS.other;
  return `
    <tr>
      <td>
        <span style="color:${color};margin-right:8px;">${icon}</span>
        <span class="file-row-name" ondblclick="previewFile(${f.id})">${escHtml(f.judul)}</span>
      </td>
      <td><span class="badge-kategori">${escHtml(f.kategori)}</span></td>
      <td>${f.fileSizeStr || "?"}</td>
      <td>${f.waktu}</td>
      <td class="file-row-actions">
        ${f.filePath ? `<a href="${f.filePath}" download="${escHtml(f.fileName)}" class="btn-card-action" title="Download">&#11123;</a>` : ""}
        <button class="btn-card-action" onclick="openEdit(${f.id})" title="Edit">&#9998;</button>
        <button class="btn-card-action btn-card-del" onclick="deleteFile(${f.id})" title="Hapus">&#128465;</button>
      </td>
    </tr>`;
}

// ============ PREVIEW ============
function previewFile(id) {
  const f = allFiles.find(x => x.id === id);
  if (!f || !f.filePath) return;
  document.getElementById("modalTitle").textContent = f.judul;
  document.getElementById("modalDownload").href     = f.filePath;
  document.getElementById("modalDownload").setAttribute("download", f.fileName);

  let bodyHtml = "";
  if (f.fileType === "pdf") {
    bodyHtml = `<iframe src="${f.filePath}" class="preview-iframe"></iframe>`;
  } else if (f.fileType === "image") {
    bodyHtml = `<img src="${f.filePath}" class="preview-img" alt="${escHtml(f.judul)}" />`;
  } else if (f.fileType === "video") {
    bodyHtml = `<video src="${f.filePath}" class="preview-video" controls></video>`;
  } else if (f.fileType === "audio") {
    bodyHtml = `<audio src="${f.filePath}" controls style="width:100%;margin-top:20px;"></audio>`;
  } else {
    bodyHtml = `<div class="preview-nopreview">
      <div style="font-size:60px;">&#128196;</div>
      <p>Preview tidak tersedia untuk tipe file ini.</p>
      <p style="color:#555;font-size:13px;">${escHtml(f.fileName || "")}</p>
    </div>`;
  }
  document.getElementById("modalBody").innerHTML = bodyHtml;
  document.getElementById("previewModal").style.display = "flex";
}

function closePreview(e) {
  if (e.target.id === "previewModal") closePreviewBtn();
}
function closePreviewBtn() {
  document.getElementById("previewModal").style.display = "none";
  document.getElementById("modalBody").innerHTML = "";
}

// ============ EDIT ============
function openEdit(id) {
  const f = allFiles.find(x => x.id === id);
  if (!f) return;
  document.getElementById("editId").value        = f.id;
  document.getElementById("editJudul").value     = f.judul;
  document.getElementById("editKategori").value  = f.kategori;
  document.getElementById("editDeskripsi").value = f.deskripsi || "";
  document.getElementById("editModal").style.display = "flex";
}

function closeEditModal(e) {
  if (e.target.id === "editModal") document.getElementById("editModal").style.display = "none";
}

async function saveEdit() {
  const id      = parseInt(document.getElementById("editId").value);
  const judul   = document.getElementById("editJudul").value.trim();
  const kategori = document.getElementById("editKategori").value;
  const deskripsi = document.getElementById("editDeskripsi").value;

  if (!judul) { alert("Judul tidak boleh kosong!"); return; }

  const res  = await fetch(API + "/files/" + id, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ judul, kategori, deskripsi }),
  });
  const json = await res.json();
  if (json.success) {
    document.getElementById("editModal").style.display = "none";
    loadAll();
  } else {
    alert("Gagal: " + json.message);
  }
}

// ============ DELETE ============
async function deleteFile(id) {
  const f = allFiles.find(x => x.id === id);
  if (!confirm("Hapus file \"" + (f ? f.judul : id) + "\"? Aksi ini tidak bisa dibatalkan!")) return;
  const res  = await fetch(API + "/files/" + id, { method: "DELETE" });
  const json = await res.json();
  if (json.success) { loadAll(); }
  else { alert("Gagal menghapus: " + json.message); }
}

// ============ FILTER / SORT / SEARCH ============
function filterKategori(el) {
  document.querySelectorAll(".sidebar-item").forEach(i => i.classList.remove("active"));
  el.classList.add("active");
  currentKategori = el.dataset.kategori;
  renderFiles();
}

function handleSearch() {
  currentSearch = document.getElementById("searchInput").value;
  renderFiles();
}

function handleSort(val) {
  currentSort = val;
  renderFiles();
}

function setView(v) {
  currentView = v;
  document.getElementById("btnGrid").classList.toggle("btn-view-active", v === "grid");
  document.getElementById("btnList").classList.toggle("btn-view-active", v === "list");
  renderFiles();
}

// ============ HELPER ============
function escHtml(str) {
  return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Init
setView("grid");
loadAll();
</script>
</body>
</html>
